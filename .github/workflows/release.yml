name: Release

# Released by hand from the Actions tab: supply MAJOR and MINOR, and the
# workflow builds both architectures inside an AlmaLinux 9 container, rewrites
# the version fallbacks in vm/version.odin, commits "release: MAJOR.MINOR",
# tags vMAJOR.MINOR, and publishes a GitHub Release with the binaries.
#
# The build runs before anything is committed or tagged, so a failed build
# leaves git untouched.
on:
  workflow_dispatch:
    inputs:
      major:
        description: "MAJOR version (integer)"
        required: true
        type: number
      minor:
        description: "MINOR version (integer)"
        required: true
        type: number
      dry_run:
        description: "Build only: skip the version bump, tag, and release"
        required: false
        type: boolean
        default: false

# GITHUB_TOKEN needs to push the version-bump commit and create the release.
# Note that a push made with GITHUB_TOKEN does not trigger other workflows.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-22.04
          - target: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate version inputs
        env:
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
        run: |
          for v in "$MAJOR" "$MINOR"; do
            if ! [[ "$v" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::version component '$v' is not a non-negative integer"
              exit 1
            fi
          done

      # Host checkout (the runner ships git), then the whole build runs inside
      # AlmaLinux 9 (glibc 2.34, free, supported to ~2032). The official Odin
      # compiler is a static binary, so the container's libc only affects the
      # produced binary. Pinned by digest for reproducibility.
      - name: Build in AlmaLinux 9
        env:
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e MAJOR -e MINOR \
            almalinux:9@sha256:3a3fa7f043b142bc8008c8b308d39b47d2c84008addcd52f9f9a7a82d2a90474 \
            bash /work/scripts/build-in-container.sh "${{ matrix.target }}"

      - name: Checksum
        run: sha256sum "makac-linux-${{ matrix.target }}" > "makac-linux-${{ matrix.target }}.sha256"

      # The binary is built against Alma's glibc 2.34. Prove it also runs on
      # other mainstream glibc userspaces (a foreign libc, not the one it was
      # built against). Images pinned by digest for reproducibility.
      - name: Runs on other distros
        run: |
          for base in \
            "ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02" \
            "debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26"
          do
            echo "::group::makac-linux-${{ matrix.target }} on ${base%%@*}"
            docker run --rm -v "$PWD:/work:ro" -w /work "$base" \
              bash /work/e2e_test/run_all.sh "/work/makac-linux-${{ matrix.target }}"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: makac-linux-${{ matrix.target }}
          path: |
            makac-linux-${{ matrix.target }}
            makac-linux-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: bump, tag, release
    # A dry run builds both binaries above but stops before touching git or
    # publishing anything.
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump version, commit, tag
        env:
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
        run: |
          set -euo pipefail
          version="${MAJOR}.${MINOR}"
          tag="v${version}"

          for v in "$MAJOR" "$MINOR"; do
            if ! [[ "$v" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::version component '$v' is not a non-negative integer"
              exit 1
            fi
          done

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi

          ./scripts/bump-version.sh "$MAJOR" "$MINOR"
          if git diff --quiet; then
            echo "::error::vm/version.odin is already at ${version}; nothing to release"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${version}"
          git tag -a "${tag}" -m "release: ${version}"
          # Atomic: the branch commit and its tag land together (or not at all).
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${tag}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.major }}.${{ inputs.minor }}
          files: artifacts/**
          generate_release_notes: true
